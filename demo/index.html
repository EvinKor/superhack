<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI MSP Platform - Demo Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 16px;
        }

        .modules-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(600px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .module-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .module-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .module-title {
            font-size: 20px;
            font-weight: 600;
            color: #333;
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-live {
            background: #10b981;
            color: white;
        }

        .status-demo {
            background: #f59e0b;
            color: white;
        }

        .module-content {
            min-height: 200px;
        }

        .metric {
            margin: 15px 0;
            padding: 12px;
            background: #f8fafc;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .metric-label {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 5px;
        }

        .metric-value {
            color: #1e293b;
            font-size: 24px;
            font-weight: 700;
        }

        .metric-sub {
            color: #94a3b8;
            font-size: 12px;
            margin-top: 4px;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #5568d3;
        }

        button:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: 8px;
            margin: 10px 0;
        }

        .success {
            background: #d1fae5;
            color: #065f46;
            padding: 12px;
            border-radius: 8px;
            margin: 10px 0;
        }

        .list-item {
            padding: 10px;
            background: #f8fafc;
            margin: 8px 0;
            border-radius: 6px;
            font-size: 14px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e2e8f0;
            border-radius: 4px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-fill {
            height: 100%;
            background: #10b981;
            transition: width 0.3s;
        }

        .form-group {
            margin: 15px 0;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #475569;
            font-size: 14px;
            font-weight: 500;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            font-size: 14px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .info-badge {
            display: inline-block;
            background: #ede9fe;
            color: #6d28d9;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            margin-left: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 AI-Powered MSP Platform Demo</h1>
            <p class="subtitle">Unified AI System with Real + Demo Modules</p>
        </div>

        <div class="modules-grid">
            <!-- Module 1: AI Proposal Assistant (LIVE) -->
            <div class="module-card">
                <div class="module-header">
                    <div class="module-title">
                        AI Proposal Assistant
                        <span class="info-badge">LIVE AI</span>
                    </div>
                    <span class="status-badge status-live">🟢 Production</span>
                </div>
                <div class="module-content">
                    <div class="form-group">
                        <label>Client Name</label>
                        <input type="text" id="clientName" value="Acme Retail" />
                    </div>
                    <div class="form-group">
                        <label>Requirements</label>
                        <textarea id="requirements">Need AWS cloud migration, SIEM security monitoring, vulnerability scans, and helpdesk support for 120 users. High uptime required.</textarea>
                    </div>
                    <div class="form-group">
                        <label>Pricing Tier</label>
                        <select id="pricingTier">
                            <option value="TIER_STARTER">Starter</option>
                            <option value="TIER_STANDARD" selected>Standard</option>
                            <option value="TIER_PREMIUM">Premium</option>
                            <option value="TIER_ENTERPRISE">Enterprise</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>SLA Level</label>
                        <select id="slaLevel">
                            <option value="SLA_BRONZE">Bronze (99.0%)</option>
                            <option value="SLA_SILVER">Silver (99.5%)</option>
                            <option value="SLA_GOLD" selected>Gold (99.9%)</option>
                            <option value="SLA_PLATINUM">Platinum (99.95%)</option>
                        </select>
                    </div>
                    <button onclick="generateProposal()" id="generateBtn">Generate Proposal</button>
                    <div id="proposalResult"></div>
                </div>
            </div>

            <!-- Module 2: Predictive Pricing (DEMO) -->
            <div class="module-card">
                <div class="module-header">
                    <div class="module-title">
                        AI Predictive Pricing
                        <span class="info-badge">DEMO</span>
                    </div>
                    <span class="status-badge status-demo">🟡 Dummy Data</span>
                </div>
                <div class="module-content">
                    <div class="form-group">
                        <label>Client ID</label>
                        <input type="text" id="pricingClientId" value="C2001" />
                    </div>
                    <div class="form-group">
                        <label>Industry</label>
                        <select id="pricingIndustry">
                            <option value="Healthcare">Healthcare</option>
                            <option value="Retail" selected>Retail</option>
                            <option value="Finance">Finance</option>
                            <option value="Manufacturing">Manufacturing</option>
                            <option value="Education">Education</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>User Count</label>
                        <input type="number" id="pricingUserCount" value="100" />
                    </div>
                    <button onclick="getPredictivePricing()" id="pricingBtn">Get Price Prediction</button>
                    <div id="pricingResult"></div>
                </div>
            </div>

            <!-- Module 3: Growth Dashboard (DEMO) -->
            <div class="module-card">
                <div class="module-header">
                    <div class="module-title">
                        Growth Dashboard
                        <span class="info-badge">DEMO</span>
                    </div>
                    <span class="status-badge status-demo">🟡 Dummy Data</span>
                </div>
                <div class="module-content">
                    <button onclick="getGrowthMetrics()" id="growthBtn">Load Growth Analytics</button>
                    <div id="growthResult"></div>
                </div>
            </div>

            <!-- Module 4: MSP Integration (DEMO) -->
            <div class="module-card">
                <div class="module-header">
                    <div class="module-title">
                        MSP Integration Status
                        <span class="info-badge">DEMO</span>
                    </div>
                    <span class="status-badge status-demo">🟡 Dummy Data</span>
                </div>
                <div class="module-content">
                    <button onclick="getIntegrationStatus()" id="integrationBtn">Check Integrations</button>
                    <div id="integrationResult"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000/api/v1';

        async function generateProposal() {
            const btn = document.getElementById('generateBtn');
            const resultDiv = document.getElementById('proposalResult');
            
            btn.disabled = true;
            resultDiv.innerHTML = '<div class="loading">Generating proposal...</div>';

            try {
                const response = await fetch(`${API_BASE}/proposals/generate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        client_name: document.getElementById('clientName').value,
                        requirements: document.getElementById('requirements').value,
                        pricing_tier_id: document.getElementById('pricingTier').value,
                        sla_id: document.getElementById('slaLevel').value,
                        quantities: { "S007": 120 },
                        use_llm: false
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="success">✅ Proposal Generated!</div>
                        <div class="metric">
                            <div class="metric-label">Total Monthly Price</div>
                            <div class="metric-value">$${data.total_price.toLocaleString()}</div>
                            <div class="metric-sub">Proposal ID: ${data.proposal_id.substring(0, 8)}...</div>
                        </div>
                        <div class="metric">
                            <div class="metric-label">Services Included</div>
                            <div class="metric-value">${data.bom.length}</div>
                            <div class="metric-sub">${data.tier.name} tier with ${data.sla.name} SLA</div>
                        </div>
                        <button onclick="downloadProposal('${data.proposal_id}')">📥 Download Proposal</button>
                    `;
                } else {
                    resultDiv.innerHTML = `<div class="error">Error: ${data.detail}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">Connection error: ${error.message}</div>`;
            } finally {
                btn.disabled = false;
            }
        }

        function downloadProposal(proposalId) {
            window.open(`${API_BASE}/proposals/${proposalId}/download`, '_blank');
        }

        async function getPredictivePricing() {
            const btn = document.getElementById('pricingBtn');
            const resultDiv = document.getElementById('pricingResult');
            
            btn.disabled = true;
            resultDiv.innerHTML = '<div class="loading">Analyzing pricing...</div>';

            try {
                const clientId = document.getElementById('pricingClientId').value;
                const industry = document.getElementById('pricingIndustry').value;
                const userCount = document.getElementById('pricingUserCount').value;

                const response = await fetch(
                    `${API_BASE}/ai/predictive-pricing?client_id=${clientId}&industry=${industry}&user_count=${userCount}&services=S001,S007,S003`
                );
                const data = await response.json();

                resultDiv.innerHTML = `
                    <div class="metric">
                        <div class="metric-label">Predicted Optimal Price</div>
                        <div class="metric-value">$${data.predicted_optimal_price.toLocaleString()}</div>
                        <div class="metric-sub">Confidence: ${(data.confidence_score * 100).toFixed(1)}%</div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">Margin Suggestion</div>
                        <div class="metric-value">${data.margin_suggestion}</div>
                        <div class="metric-sub">Current: ${data.current_margin_percent}% → Suggested: ${data.suggested_margin_percent}%</div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">Top Upsell Recommendations</div>
                        ${data.upsell_recommendations.map(rec => `<div class="list-item">• ${rec}</div>`).join('')}
                    </div>
                `;
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            } finally {
                btn.disabled = false;
            }
        }

        async function getGrowthMetrics() {
            const btn = document.getElementById('growthBtn');
            const resultDiv = document.getElementById('growthResult');
            
            btn.disabled = true;
            resultDiv.innerHTML = '<div class="loading">Loading analytics...</div>';

            try {
                const response = await fetch(`${API_BASE}/dashboard/growth`);
                const data = await response.json();

                const mrr = data.overview.monthly_recurring_revenue;
                const arr = data.overview.annual_recurring_revenue;
                const growth = data.growth_metrics.monthly_growth_rate;
                const churn = data.growth_metrics.predicted_churn_rate;

                resultDiv.innerHTML = `
                    <div class="metric">
                        <div class="metric-label">Monthly Recurring Revenue (MRR)</div>
                        <div class="metric-value">$${mrr.toLocaleString()}</div>
                        <div class="metric-sub">ARR: $${arr.toLocaleString()}</div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">Growth Rate</div>
                        <div class="metric-value">${growth}%</div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${Math.min(growth * 5, 100)}%"></div>
                        </div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">Profitability Index</div>
                        <div class="metric-value">${data.overview.profitability_index}</div>
                        <div class="metric-sub">Churn Risk: ${churn}% | Clients: ${data.overview.total_clients}</div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">Next Quarter Forecast</div>
                        <div class="metric-value">$${data.forecasts.next_quarter_revenue.toLocaleString()}</div>
                        <div class="metric-sub">Expansion Opportunity: $${data.growth_metrics.expansion_opportunity.toLocaleString()}</div>
                    </div>
                `;
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            } finally {
                btn.disabled = false;
            }
        }

        async function getIntegrationStatus() {
            const btn = document.getElementById('integrationBtn');
            const resultDiv = document.getElementById('integrationResult');
            
            btn.disabled = true;
            resultDiv.innerHTML = '<div class="loading">Checking integrations...</div>';

            try {
                const response = await fetch(`${API_BASE}/integration/msp-sync`);
                const data = await response.json();

                const integrations = data.integrations;
                let html = '';

                for (const [key, integration] of Object.entries(integrations)) {
                    const statusColor = integration.health_status === 'Healthy' ? '#10b981' : '#f59e0b';
                    html += `
                        <div class="list-item">
                            <strong>${integration.name}</strong>
                            <span style="float:right;color:${statusColor};font-weight:600">${integration.status}</span>
                            <div class="metric-sub">
                                Last Sync: ${new Date(integration.last_sync).toLocaleTimeString()} | 
                                Entities: ${integration.entities_synced.join(', ')}
                            </div>
                        </div>
                    `;
                }

                html += `
                    <div class="metric" style="margin-top:15px">
                        <div class="metric-label">Overall Health</div>
                        <div class="metric-value">${data.summary.health_score}%</div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${data.summary.health_score}%"></div>
                        </div>
                        <div class="metric-sub">
                            Active: ${data.summary.active_connections}/${data.summary.total_integrations} | 
                            Syncs (1h): ${data.recent_activity.last_hour_syncs}
                        </div>
                    </div>
                `;

                resultDiv.innerHTML = html;
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            } finally {
                btn.disabled = false;
            }
        }

        // Auto-load status on page load
        window.addEventListener('load', async () => {
            try {
                const response = await fetch(`${API_BASE}/status`);
                const data = await response.json();
                console.log('Module Status:', data);
            } catch (error) {
                console.error('Failed to load status:', error);
            }
        });
    </script>
</body>
</html>
